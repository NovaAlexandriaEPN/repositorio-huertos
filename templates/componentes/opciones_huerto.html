<details class="ayuda explicacion-opciones">
  <summary>Qué significa cada opción de {{ campo.label|lower }}</summary>
  <dl>
    {% for opcion in campo.field.queryset %}
      <dt>{{ opcion.nombre }}</dt>
      <dd>{{ opcion.explicacion|default:"Explicación pendiente de completar." }}</dd>
    {% endfor %}
  </dl>
</details>
